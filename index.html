<!DOCTYPE html>
<html>
<head>
  <title>Personal Info Form</title>
</head>
<body>
<h2>Personal info</h2>
<form action="PersonalInfoServlet"method="post"

Name:
  <input type="text" name="name" placeholder="Enter your first name" required>
  <br><br>
  Gender:
  <input type="radio" name="gender" value="Male">Male
  <input type="radio" name="gender" value="Female>Female
  <br><br>
  Email:
  <input type="email" name="email" placeholder="Emter your email" required>
  <br><br>
  Date of Birth:
  <input type="date" name="dob">
  <br><br>
  Course:
  <select name="course">
     <option value="">--Select--</option>
     <option value="B.E">B.E</option>
     <option value="B.Tech">B.Tech</option>
     <option value="BCA">BCA</option>
     <option value="MCA">MCA</option>
   </select>
   <br><br>
  Branch:
  <select name="branch">
    <option value="">--Branch--</option>
    <option value="CSE(CY)">CSE(CY)</option>
    <option value="CSE">CSE</option>
    <option value="IT">IT</option>
    <option value="ECE">ECE</option>
  </select>
  <br><br>
  Phone:
  <input type="text" name="phone" placeholder="+91XXXXXXXXXX">
  <br><br>
  Technical Skills:<br>
  <input type="checkbox" name="skills" value="C">C<br>
  <input type="checkbox" name="skills" value="C++">C++<br>
  <input type="checkbox" name="skills" value="Java">java<br>
  <input type="checkbox" name="skills" value="Oracle">Oracle<br>
  <input type="checkbox" name="skills" value="HTML">HTML<br>
  <input type="checkbox" name="skills" value="Others">Others<br><br>
  <input type="submit" value="submit">
  <input type="reset" value="Reset">
</form>
</body>
</html>
